{% extends "base.html" %} 

{% block title %} Register Page 
{% endblock %}

{% block style %}
<link
rel="stylesheet"
type="text/css"
href="{{ url_for('static',filename='styles/style_register.css') }}"
/>

{% endblock %}
{% block content %}
<div class="main_1">
  <div class="form_login" method="POST">
    <h2 class="login_title"> Register Here</h2>
    {% if error_1 %}
    <br />
    <p class="error_1">User Name or Password wrong!. <br> Try again</p>
    {% endif %}
    <form action="" method="post" enctype="multipart/form-data">
      <input type="text" name="first_name" id="" placeholder="Enter First Name" required >
      <input type="text" name="last_name" id="last_name" placeholder="Enter Last Name"><br>
      <input type="text" name="user_name" id="input_big" placeholder="Enter New User Name" required >
      <input type="password"  name="password" id="input_big" minlength="7" placeholder="Enter New Password" required >
      <input type="password"  name="password_2" id="input_big"  placeholder="Confirm Your Password" required >
      <br>
      <div class="select-profile">
        <div class="gender-select">
      <label class="gender">Gender :</label>
        <select class="form_select" name="gender" required>
            <option selected>Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>  
          <label for="picture" class="gender"> Profile-Picture</label>
          <input type="file" accept="image/*" name="picture" id="imgInp">
        </div>
      <button class="btn_submit" type="submit" >Sign Up</button>
  </form>
  <p class="back_to_register">Alredy have account?<br><br>
    <a href="/login" class="register"> Login</a> Here</p>

  </div> 
</div>
{% endblock %}
